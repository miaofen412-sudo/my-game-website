<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜拳｜我的遊戲樂園</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .game-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
        }

        .game-container h1 {
            margin-bottom: 10px;
        }

        .game-container p {
            font-size: 18px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 35px 0;
            flex-wrap: wrap;
        }

        .choice-button {
            width: 130px;
            height: 130px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 50px;
            cursor: pointer;
            transition: 0.2s;
        }

        .choice-button:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-5px);
        }

        .choice-name {
            display: block;
            margin-top: 8px;
            font-size: 17px;
        }

        .result {
            min-height: 150px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
        }

        .result-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result-detail {
            font-size: 20px;
            line-height: 1.8;
        }

        .score {
            margin: 25px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .restart-button {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart-button:hover {
            transform: scale(1.05);
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .choice-button {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🎮 我的遊戲樂園</div>

        <nav>
            <a href="../index.html">首頁</a>
            <a href="../index.html#games">遊戲</a>
        </nav>
    </header>

    <main>
        <section class="game-container">

            <h1>✊✋✌️ 猜拳</h1>

            <p>選擇你的出拳，看看能不能打敗電腦！</p>

            <div class="choices">
                <button class="choice-button" onclick="playGame('rock')">
                    ✊
                    <span class="choice-name">石頭</span>
                </button>

                <button class="choice-button" onclick="playGame('paper')">
                    ✋
                    <span class="choice-name">布</span>
                </button>

                <button class="choice-button" onclick="playGame('scissors')">
                    ✌️
                    <span class="choice-name">剪刀</span>
                </button>
            </div>

            <div class="result" id="result">
                <div class="result-title">準備好了嗎？</div>
                <div class="result-detail">
                    請選擇你的出拳！
                </div>
            </div>

            <div class="score">
                🏆 你：<span id="wins">0</span>
               　
🤖 電腦：<span id="losses">0</span>
               　
🤝 平手：<span id="draws">0</span>
            </div>

            <button class="restart-button" onclick="restartGame()">
                🔄 重新開始
            </button>

            <br>

            <a class="back-button" href="../index.html">
                ← 回到遊戲首頁
            </a>

        </section>
    </main>

    <script>
        const choices = ["rock", "paper", "scissors"];

        const choiceNames = {
            rock: "✊ 石頭",
            paper: "✋ 布",
            scissors: "✌️ 剪刀"
        };

        let wins = 0;
        let losses = 0;
        let draws = 0;

        function playGame(playerChoice) {
            const computerChoice =
                choices[Math.floor(Math.random() * choices.length)];

            let result = "";

            if (playerChoice === computerChoice) {
                result = "🤝 平手！";
                draws++;
            } else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {
                result = "🎉 你贏了！";
                wins++;
            } else {
                result = "😢 電腦贏了！";
                losses++;
            }

            document.getElementById("result").innerHTML = `
                <div class="result-title">${result}</div>
                <div class="result-detail">
                    你出了：${choiceNames[playerChoice]}<br>
                    電腦出了：${choiceNames[computerChoice]}
                </div>
            `;

            updateScore();
        }

        function updateScore() {
            document.getElementById("wins").textContent = wins;
            document.getElementById("losses").textContent = losses;
            document.getElementById("draws").textContent = draws;
        }

        function restartGame() {
            wins = 0;
            losses = 0;
            draws = 0;

            updateScore();

            document.getElementById("result").innerHTML = `
                <div class="result-title">準備好了嗎？</div>
                <div class="result-detail">
                    請選擇你的出拳！
                </div>
            `;
        }
    </script>

</body>
</html>
