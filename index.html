<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>我的遊戲樂園</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         網站標題與導覽列
    ========================== -->

    <header>

        <div class="logo">
            🎮 我的遊戲樂園
        </div>

        <nav>

            <a href="index.html">
                首頁
            </a>

            <a href="#games">
                遊戲
            </a>

        </nav>

    </header>



    <!-- =========================
         首頁主要內容
    ========================== -->

    <main>


        <!-- 首頁歡迎區 -->

        <section class="hero">

            <h1>
                歡迎來到我的遊戲樂園 🎮
            </h1>

            <p>
                休息一下，玩個小遊戲吧！
            </p>

            <a
                class="hero-button"
                href="#games"
            >
                開始遊戲
            </a>

        </section>



        <!-- =========================
             遊戲區
        ========================== -->

        <section
            class="games-section"
            id="games"
        >

            <h2>
                🎮 遊戲列表
            </h2>


            <div class="game-grid">


                <!-- =========================
                     1. 數字猜謎
                ========================== -->

                <div class="game-card">

                    <div class="game-icon">
                        🔢
                    </div>

                    <h3>
                        數字猜謎
                    </h3>

                    <p>
                        猜猜看電腦想的數字是多少！
                    </p>

                    <a
                        class="game-button"
                        href="games/guess-number.html"
                    >
                        開始遊戲
                    </a>

                </div>



                <!-- =========================
                     2. 記憶翻牌
                ========================== -->

                <div class="game-card">

                    <div class="game-icon">
                        🧠
                    </div>

                    <h3>
                        記憶翻牌
                    </h3>

                    <p>
                        找出相同的卡片，挑戰你的記憶力！
                    </p>

                    <a
                        class="game-button"
                        href="games/memory.html"
                    >
                        開始遊戲
                    </a>

                </div>



                <!-- =========================
                     3. 圈圈叉叉
                ========================== -->

                <div class="game-card">

                    <div class="game-icon">
                        ⭕❌
                    </div>

                    <h3>
                        圈圈叉叉
                    </h3>

                    <p>
                        和電腦來一場圈圈叉叉對決！
                    </p>

                    <a
                        class="game-button"
                        href="games/tic-tac-toe.html"
                    >
                        開始遊戲
                    </a>

                </div>



                <!-- =========================
                     4. 猜拳
                ========================== -->

                <div class="game-card">

                    <div class="game-icon">
                        ✊✋✌️
                    </div>

                    <h3>
                        猜拳
                    </h3>

                    <p>
                        石頭、剪刀、布，看誰比較厲害！
                    </p>

                    <a
                        class="game-button"
                        href="games/rock-paper-scissors.html"
                    >
                        開始遊戲
                    </a>

                </div>



                <!-- =========================
                     5. 貪吃蛇
                ========================== -->

                <div class="game-card">

                    <div class="game-icon">
                        🐍
                    </div>

                    <h3>
                        貪吃蛇
                    </h3>

                    <p>
                        控制蛇吃掉蘋果，挑戰最高分！
                    </p>

                    <a
                        class="game-button"
                        href="games/snake.html"
                    >
                        開始遊戲
                    </a>

                </div>



                <!-- =========================
                     6. 幸運骰子
                ========================== -->

                <div class="game-card">

                    <div class="game-icon">
                        🎲
                    </div>

                    <h3>
                        幸運骰子
                    </h3>

                    <p>
                        即將推出新的小遊戲！
                    </p>

                    <span class="coming-soon">
                        即將推出
                    </span>

                </div>



            </div>

        </section>


    </main>



    <!-- =========================
         頁尾
    ========================== -->

    <footer>

        <p>
            © 2026 我的遊戲樂園
        </p>

    </footer>


</body>

</html>
