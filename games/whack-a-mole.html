```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐹 打地鼠挑戰｜我的遊戲樂園</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      color: #333;
    }

    /* ===== 頂部導覽 ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 70px;
      background: rgba(30, 30, 60, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .nav {
      display: flex;
      gap: 25px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    .nav a:hover {
      color: #ffd166;
    }

    /* ===== 主內容 ===== */
    .container {
      width: 92%;
      max-width: 850px;
      margin: 40px auto;
    }

    .game-card {
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      color: #5b3cc4;
      margin-bottom: 10px;
      font-size: 36px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    /* ===== 難度 ===== */
    .levels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .level-btn {
      border: none;
      padding: 14px 10px;
      border-radius: 12px;
      background: #eee;
      color: #444;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .level-btn:hover {
      transform: translateY(-2px);
      background: #ddd;
    }

    .level-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    /* ===== 資訊 ===== */
    .info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .info-box {
      background: #f7f7fb;
      border-radius: 15px;
      padding: 14px 8px;
    }

    .info-title {
      color: #888;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      color: #5b3cc4;
      font-size: 23px;
      font-weight: bold;
    }

    /* ===== 遊戲區 ===== */
    .board {
      width: min(100%, 520px);
      margin: 0 auto 25px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .hole {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle, #3d2b1f 0%, #24170f 65%, #160d08 100%);
      box-shadow:
        inset 0 8px 12px rgba(0, 0, 0, 0.45),
        0 5px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      overflow: hidden;
    }

    /* ===== 地鼠 ===== */
    .mole {
      position: absolute;
      width: 68%;
      height: 68%;
      left: 16%;
      top: 35%;
      background: #9b5a32;
      border-radius: 48% 48% 42% 42%;
      animation: pop 0.18s ease-out;
      cursor: pointer;
    }

    .mole::before,
    .mole::after {
      content: "";
      position: absolute;
      width: 27%;
      height: 27%;
      top: -10%;
      background: #9b5a32;
      border-radius: 50%;
    }

    .mole::before {
      left: 4%;
    }

    .mole::after {
      right: 4%;
    }

    .eye {
      position: absolute;
      top: 27%;
      width: 11%;
      height: 14%;
      background: #111;
      border-radius: 50%;
    }

    .eye.left {
      left: 25%;
    }

    .eye.right {
      right: 25%;
    }

    .nose {
      position: absolute;
      width: 18%;
      height: 13%;
      left: 41%;
      top: 48%;
      background: #e69b8d;
      border-radius: 50%;
    }

    .mouth {
      position: absolute;
      width: 25%;
      height: 15%;
      left: 37.5%;
      top: 62%;
      border-bottom: 3px solid #32170e;
      border-radius: 50%;
    }

    .mole.hit {
      transform: scale(0.85);
    }

    @keyframes pop {
      from {
        transform: translateY(35px) scale(0.8);
      }

      to {
        transform: translateY(0) scale(1);
      }
    }

    /* ===== 按鈕 ===== */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .start-btn,
    .restart-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .start-btn {
      background: #5b3cc4;
      color: white;
    }

    .restart-btn {
      background: #eee;
      color: #444;
    }

    .start-btn:hover,
    .restart-btn:hover {
      transform: translateY(-2px);
    }

    .message {
      min-height: 28px;
      margin-top: 18px;
      color: #5b3cc4;
      font-weight: bold;
    }

    /* ===== 手機版 ===== */
    @media (max-width: 700px) {
      .header {
        padding: 0 4%;
      }

      .logo {
        font-size: 17px;
      }

      .nav {
        gap: 12px;
      }

      .nav a {
        font-size: 14px;
      }

      .game-card {
        padding: 25px 18px;
      }

      h1 {
        font-size: 29px;
      }

      .info {
        grid-template-columns: repeat(2, 1fr);
      }

      .board {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 頂部導覽 ===== -->
  <header class="header">
    <div class="logo">🎮 我的遊戲樂園</div>

    <nav class="nav">
      <a href="../index.html">首頁</a>
      <a href="../index.html#games">遊戲</a>
      <a href="../index.html#about">關於</a>
    </nav>
  </header>

  <!-- ===== 遊戲 ===== -->
  <main class="container">
    <div class="game-card">

      <h1>🐹 打地鼠挑戰</h1>
      <p class="subtitle">眼明手快！看到地鼠就趕快點下去！</p>

      <!-- 難度 -->
      <div class="levels">
        <button class="level-btn active" data-speed="1800">
          🌱 簡單
        </button>

        <button class="level-btn" data-speed="1100">
          ⚡ 普通
        </button>

        <button class="level-btn" data-speed="700">
          🔥 困難
        </button>
      </div>

      <!-- 資訊 -->
      <div class="info">
        <div class="info-box">
          <div class="info-title">進度</div>
          <div class="info-value" id="round">0 / 10</div>
        </div>

        <div class="info-box">
          <div class="info-title">分數</div>
          <div class="info-value" id="score">0</div>
        </div>

        <div class="info-box">
          <div class="info-title">擊中</div>
          <div class="info-value" id="hits">0</div>
        </div>

        <div class="info-box">
          <div class="info-title">連擊</div>
          <div class="info-value" id="combo">0</div>
        </div>
      </div>

      <!-- 9 個洞 -->
      <div class="board" id="board">
        <div class="hole" data-index="0"></div>
        <div class="hole" data-index="1"></div>
        <div class="hole" data-index="2"></div>
        <div class="hole" data-index="3"></div>
        <div class="hole" data-index="4"></div>
        <div class="hole" data-index="5"></div>
        <div class="hole" data-index="6"></div>
        <div class="hole" data-index="7"></div>
        <div class="hole" data-index="8"></div>
      </div>

      <!-- 控制 -->
      <div class="controls">
        <button class="start-btn" id="startBtn">開始遊戲</button>
        <button class="restart-btn" id="restartBtn">重新開始</button>
      </div>

      <div class="message" id="message">
        選擇難度後，按「開始遊戲」！
      </div>

    </div>
  </main>

  <script>
    const holes = document.querySelectorAll(".hole");
    const levelButtons = document.querySelectorAll(".level-btn");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const roundText = document.getElementById("round");
    const scoreText = document.getElementById("score");
    const hitsText = document.getElementById("hits");
    const comboText = document.getElementById("combo");
    const message = document.getElementById("message");

    let speed = 1800;
    let timer = null;
    let gameRunning = false;

    let round = 0;
    let score = 0;
    let hits = 0;
    let combo = 0;

    let currentHole = null;
    let currentMole = null;

    const totalRounds = 10;

    /* ===== 選擇難度 ===== */
    levelButtons.forEach(button => {
      button.addEventListener("click", () => {

        if (gameRunning) return;

        levelButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        speed = Number(button.dataset.speed);

        message.textContent = "難度已設定，按「開始遊戲」！";
      });
    });

    /* ===== 開始遊戲 ===== */
    startBtn.addEventListener("click", startGame);

    function startGame() {

      if (gameRunning) return;

      gameRunning = true;

      round = 0;
      score = 0;
      hits = 0;
      combo = 0;

      updateInfo();

      startBtn.disabled = true;
      startBtn.textContent = "遊戲進行中";

      message.textContent = "準備好！抓住地鼠！";

      nextRound();
    }

    /* ===== 下一回合 ===== */
    function nextRound() {

      if (!gameRunning) return;

      clearBoard();

      if (round >= totalRounds) {
        endGame();
        return;
      }

      round++;

      updateInfo();

      const randomIndex = Math.floor(Math.random() * holes.length);

      currentHole = holes[randomIndex];

      currentMole = createMole();

      currentHole.appendChild(currentMole);

      timer = setTimeout(() => {

        if (currentMole && currentMole.parentElement) {
          currentMole.remove();

          combo = 0;

          updateInfo();
        }

        setTimeout(nextRound, 250);

      }, speed);
    }

    /* ===== 建立地鼠 ===== */
    function createMole() {

      const mole = document.createElement("div");

      mole.className = "mole";

      mole.innerHTML = `
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      `;

      mole.addEventListener("click", hitMole);

      return mole;
    }

    /* ===== 打中地鼠 ===== */
    function hitMole(event) {

      event.stopPropagation();

      if (!gameRunning) return;

      clearTimeout(timer);

      hits++;

      combo++;

      const comboBonus = Math.min(combo - 1, 10);

      score += 10 + comboBonus;

      currentMole.classList.add("hit");

      message.textContent =
        combo >= 2
          ? `🎯 太棒了！${combo} 連擊！`
          : "🎯 打中了！";

      updateInfo();

      setTimeout(() => {
        clearBoard();
        setTimeout(nextRound, 200);
      }, 120);
    }

    /* ===== 清除目前地鼠 ===== */
    function clearBoard() {

      clearTimeout(timer);

      holes.forEach(hole => {
        hole.innerHTML = "";
      });

      currentHole = null;
      currentMole = null;
    }

    /* ===== 更新資訊 ===== */
    function updateInfo() {

      roundText.textContent = `${round} / ${totalRounds}`;
      scoreText.textContent = score;
      hitsText.textContent = hits;
      comboText.textContent = combo;
    }

    /* ===== 遊戲結束 ===== */
    function endGame() {

      gameRunning = false;

      clearBoard();

      startBtn.disabled = false;
      startBtn.textContent = "再玩一次";

      message.textContent =
        `🎉 遊戲結束！你得到 ${score} 分，共擊中 ${hits} 隻地鼠！`;

      updateInfo();
    }

    /* ===== 重新開始 ===== */
    restartBtn.addEventListener("click", () => {

      clearBoard();

      gameRunning = false;

      round = 0;
      score = 0;
      hits = 0;
      combo = 0;

      startBtn.disabled = false;
      startBtn.textContent = "開始遊戲";

      message.textContent = "選擇難度後，按「開始遊戲」！";

      updateInfo();
    });

    updateInfo();
  </script>

</body>
</html>
