<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的遊戲樂園</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 頁首 -->
    <header>
        <div class="logo">
            🎮 我的遊戲樂園
        </div>

        <nav>
            <a href="index.html">首頁</a>
            <a href="#games">遊戲</a>
            <a href="#about">關於</a>
        </nav>
    </header>


    <!-- 首頁主視覺 -->
    <main>

        <section class="hero">
            <h1>🎮 歡迎來到遊戲樂園</h1>

            <p>
                放鬆一下，挑戰自己，選一個遊戲開始玩吧！
            </p>
        </section>


        <!-- 遊戲區 -->
        <section class="games-section" id="games">

            <h2 class="section-title">
                🕹️ 遊戲大廳
            </h2>


            <div class="game-grid">

                <!-- 猜數字 -->
                <div class="game-card">

                    <div>
                        <div class="game-icon">🔢</div>

                        <h3>猜數字</h3>

                        <p>
                            猜猜電腦心裡的數字，
                            看看你能幾次猜中！
                        </p>
                    </div>

                    <a
                        class="game-button"
                        href="games/guess-number.html"
                    >
                        開始遊戲
                    </a>

                </div>


                <!-- 記憶翻牌 -->
                <div class="game-card">

                    <div>
                        <div class="game-icon">🧠</div>

                        <h3>記憶翻牌</h3>

                        <p>
                            找出相同的卡牌，
                            挑戰你的記憶力！
                        </p>
                    </div>

                    <span class="coming-soon">
                        即將推出
                    </span>

                </div>


                <!-- 反應挑戰 -->
                <div class="game-card">

                    <div>
                        <div class="game-icon">⚡</div>

                        <h3>反應挑戰</h3>

                        <p>
                            看看你的反應速度
                            到底有多快！
                        </p>
                    </div>

                    <span class="coming-soon">
                        即將推出
                    </span>

                </div>


                <!-- 猜拳 -->
                <div class="game-card">

                    <div>
                        <div class="game-icon">✂️</div>

                        <h3>剪刀石頭布</h3>

                        <p>
                            和電腦來一場經典猜拳對決。
                        </p>
                    </div>

                    <span class="coming-soon">
                        即將推出
                    </span>

                </div>


                <!-- 圈圈叉叉 -->
                <div class="game-card">

                    <div>
                        <div class="game-icon">⭕</div>

                        <h3>圈圈叉叉</h3>

                        <p>
                            經典益智遊戲，
                            看看誰能先連成一線！
                        </p>
                    </div>

                    <span class="coming-soon">
                        即將推出
                    </span>

                </div>


                <!-- 骰子 -->
                <div class="game-card">

                    <div>
                        <div class="game-icon">🎲</div>

                        <h3>幸運骰子</h3>

                        <p>
                            擲出你的幸運數字，
                            看看今天的運氣如何！
                        </p>
                    </div>

                    <span class="coming-soon">
                        即將推出
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- 頁尾 -->
    <footer id="about">
        🎮 我的遊戲樂園　｜　更多遊戲持續更新中
    </footer>

</body>
</html>
